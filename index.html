<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>記帳小幫手</title>
<style>
/* ══ THEMES ══ */
:root,[data-theme=purple]{--pr:#7B6CF6;--pr2:#9B59B6;--pr-rgb:123,108,246;--inc:#34C759;--exp:#FF3B30;--bg:#F2F2F7;--card:#fff;--tb:#fff;--tx:#1C1C1E;--sub:#8E8E93;--bdr:#E5E5EA;}
[data-theme=coral] {--pr:#FF6500;--pr2:#E55B00;--pr-rgb:255,101,0;  --inc:#00B894;--exp:#D63031;--bg:#FFF5F0;--card:#fff;--tb:#fff;--tx:#1C1C1E;--sub:#8E8E93;--bdr:#E5E5EA;}
[data-theme=green] {--pr:#00B894;--pr2:#00967A;--pr-rgb:0,184,148;   --inc:#0984E3;--exp:#E17055;--bg:#F0FFF4;--card:#fff;--tb:#fff;--tx:#1C1C1E;--sub:#8E8E93;--bdr:#E5E5EA;}
[data-theme=blue]  {--pr:#0984E3;--pr2:#0773C5;--pr-rgb:9,132,227;   --inc:#00CEC9;--exp:#FF7675;--bg:#EFF6FF;--card:#fff;--tb:#fff;--tx:#1C1C1E;--sub:#8E8E93;--bdr:#E5E5EA;}
[data-theme=pink]  {--pr:#E84393;--pr2:#C73580;--pr-rgb:232,67,147;  --inc:#00B894;--exp:#FF7675;--bg:#FFF0F5;--card:#fff;--tb:#fff;--tx:#1C1C1E;--sub:#8E8E93;--bdr:#E5E5EA;}
[data-theme=gold]  {--pr:#E67E22;--pr2:#CA6F1E;--pr-rgb:230,126,34;  --inc:#27AE60;--exp:#C0392B;--bg:#FFFBF0;--card:#fff;--tb:#fff;--tx:#1C1C1E;--sub:#8E8E93;--bdr:#E5E5EA;}
[data-theme=dark]  {--pr:#A29BFE;--pr2:#7C75D6;--pr-rgb:162,155,254; --inc:#55EFC4;--exp:#FF7675;--bg:#1C1C1E;--card:#2C2C2E;--tb:#1C1C1E;--tx:#FFF;--sub:#8E8E93;--bdr:#3A3A3C;}
[data-theme=lulu]  {--pr:#FF7BAC;--pr2:#FF5288;--pr-rgb:255,123,172; --inc:#5DC88A;--exp:#FF6060;--bg:#FFF4F8;--card:#FFFFFF;--tb:#FFF0F5;--tx:#2D1B25;--sub:#C4849E;--bdr:#FFD6E8;}

/* ══ RESET ══ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--tx);max-width:430px;margin:0 auto;min-height:100vh;overflow-x:hidden;
  --st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,34px);}

/* ══ TOPBAR ══ */
.topbar{background:var(--tb);padding:calc(var(--st)+2px) 18px 11px;display:flex;
  align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);
  position:sticky;top:0;z-index:40;}
.tb-m{display:flex;align-items:center;gap:6px;}
.tb-m span{font-size:17px;font-weight:700;}
.tbtn{background:none;border:none;font-size:19px;cursor:pointer;color:var(--sub);
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;}

/* ══ PAGES ══ */
.page{display:none;} .page.active{display:block;}
.scr{padding-bottom:calc(var(--sb)+68px);}

/* ══ HOME DONUT ══ */
.donut-sec{background:var(--card);margin-bottom:10px;padding:16px 18px 14px;}
.d-wrap{display:flex;align-items:center;gap:18px;}
.d-ring{position:relative;width:140px;height:140px;flex-shrink:0;}
.d-ring svg{width:140px;height:140px;}
.d-ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.d-ctr .dl{font-size:11px;color:var(--sub);margin-bottom:2px;}
.d-ctr .dv{font-size:20px;font-weight:800;letter-spacing:-.5px;}
.dv.pos{color:var(--pr);} .dv.neg{color:var(--exp);}
.d-stats{flex:1;display:flex;flex-direction:column;gap:11px;}
.dst{display:flex;align-items:center;gap:8px;}
.dsdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.dsl{font-size:11px;color:var(--sub);}
.dsv{font-size:17px;font-weight:700;}
.dsv.inc{color:var(--inc);} .dsv.exp{color:var(--exp);}
.bstrip{background:var(--bg);border-radius:10px;padding:9px 12px;margin-top:11px;}
.bstrip-hd{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:5px;}
.bbar{height:5px;background:var(--bdr);border-radius:3px;overflow:hidden;}
.bbarf{height:100%;border-radius:3px;transition:width .5s;}

/* ══ SECTION ══ */
.sec{background:var(--card);margin-bottom:10px;}
.sec-hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 7px;border-bottom:1px solid var(--bdr);}
.sec-hd .t{font-size:15px;font-weight:700;}
.sec-hd .m{font-size:13px;color:var(--pr);background:none;border:none;cursor:pointer;font-weight:500;}

/* ══ TX ROW ══ */
.dg-hd{display:flex;justify-content:space-between;padding:9px 16px 3px;}
.dg-dt{font-size:12px;font-weight:600;color:var(--sub);}
.dg-tot{font-size:12px;color:var(--sub);}
.tx-row{display:flex;align-items:center;gap:11px;padding:9px 16px;border-top:1px solid var(--bdr);}
.tx-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tx-bd{flex:1;min-width:0;}
.tx-nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-mt{font-size:11px;color:var(--sub);margin-top:2px;}
.tx-tag{background:var(--bg);border-radius:4px;padding:1px 5px;font-size:10px;}
.tx-rt{text-align:right;flex-shrink:0;}
.tx-amt{font-size:14px;font-weight:700;}
.tx-amt.income{color:var(--inc);} .tx-amt.expense{color:var(--exp);}
.tx-del{font-size:11px;color:var(--sub);cursor:pointer;margin-top:2px;}
.empty{text-align:center;padding:28px;color:var(--sub);}
.empty .ei{font-size:40px;margin-bottom:8px;}
.empty p{font-size:13px;}

/* ══ FAB ══ */
.fab{position:fixed;bottom:calc(var(--sb)+74px);right:20px;width:52px;height:52px;
  border-radius:50%;background:var(--pr);
  box-shadow:0 4px 14px rgba(var(--pr-rgb),.45);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;
  z-index:60;transition:transform .15s;}
.fab:active{transform:scale(.9);}
.fab.hidden{display:none;}

/* ══ BOTTOM SHEET ══ */
.ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);
  display:none;align-items:flex-end;backdrop-filter:blur(4px);}
.ov.open{display:flex;}
.sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:430px;
  margin:0 auto;padding-bottom:calc(var(--sb)+10px);
  animation:sUp .32s cubic-bezier(.34,1.56,.64,1);max-height:92vh;overflow-y:auto;}
@keyframes sUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.s-hnd{width:36px;height:4px;border-radius:2px;background:var(--bdr);margin:10px auto 0;}
.s-ttl{text-align:center;font-size:16px;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--bdr);}

/* Add form */
.type-row{display:flex;padding:10px 10px 0;gap:4px;}
.tbtn2{flex:1;padding:9px;border:none;border-radius:10px;font-size:13px;font-weight:600;
  cursor:pointer;background:var(--bg);color:var(--sub);transition:all .2s;}
.tbtn2.ae{background:var(--exp);color:#fff;}
.tbtn2.ai{background:var(--inc);color:#fff;}
.amt-row{display:flex;align-items:center;padding:8px 16px 6px;border-bottom:1px solid var(--bdr);gap:6px;}
.amt-sy{font-size:19px;color:var(--sub);}
.amt-in{flex:1;font-size:34px;font-weight:700;border:none;outline:none;background:none;color:var(--tx);caret-color:var(--pr);}
.amt-in::placeholder{color:var(--bdr);}
.amt-cl{background:var(--bg);border:none;width:24px;height:24px;border-radius:50%;font-size:12px;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.slbl{display:flex;align-items:center;padding:8px 14px 4px;gap:5px;font-size:12px;font-weight:600;color:var(--sub);}
.snum{background:var(--pr);color:#fff;width:16px;height:16px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sbk{background:none;border:none;color:var(--pr);font-size:12px;font-weight:600;cursor:pointer;margin-left:auto;}
.hsc{display:flex;overflow-x:auto;gap:8px;padding:4px 14px 12px;scrollbar-width:none;}
.hsc::-webkit-scrollbar{display:none;}
.mc{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex-shrink:0;}
.mc-i{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;border:2.5px solid transparent;}
.mc-i.sel{border-color:var(--pr);box-shadow:0 0 0 3px rgba(var(--pr-rgb),.15);}
.mc:active .mc-i{transform:scale(.9);}
.mc-l{font-size:10px;color:var(--sub);font-weight:500;}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:4px 14px 12px;}
.sg{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:8px 4px;border-radius:11px;border:2px solid transparent;background:var(--bg);}
.sg.sel{border-color:var(--pr);background:rgba(var(--pr-rgb),.08);}
.sg-i{font-size:20px;} .sg-l{font-size:10px;color:var(--sub);font-weight:500;text-align:center;}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:4px 14px 12px;}
.pg{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:10px 4px;border-radius:11px;border:2px solid var(--bdr);background:var(--bg);}
.pg.sel{border-color:var(--pr);background:rgba(var(--pr-rgb),.08);}
.pg-i{font-size:22px;} .pg-l{font-size:11px;color:var(--sub);font-weight:600;}
.crumbs{display:flex;gap:5px;padding:2px 14px 4px;flex-wrap:wrap;}
.crumb{display:inline-flex;gap:3px;background:rgba(var(--pr-rgb),.1);color:var(--pr);border-radius:14px;padding:3px 9px;font-size:11px;font-weight:600;}
.ni-row{padding:0 14px 8px;}
.ni{width:100%;padding:9px 12px;border:1.5px solid var(--bdr);border-radius:10px;font-size:13px;
  outline:none;background:var(--bg);color:var(--tx);font-family:inherit;transition:border-color .2s;}
.ni:focus{border-color:var(--pr);}
.ni-sel{width:100%;padding:9px 12px;border:1.5px solid var(--bdr);border-radius:10px;font-size:13px;
  outline:none;background:var(--bg);color:var(--tx);font-family:inherit;-webkit-appearance:none;}
.sbtn{display:block;width:calc(100% - 28px);margin:0 14px 12px;padding:13px;border:none;
  border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;}
.sbtn:active{opacity:.85;}

/* ══ BOTTOM NAV ══ */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  background:var(--tb);backdrop-filter:blur(16px);border-top:1px solid var(--bdr);
  display:flex;padding-bottom:var(--sb);z-index:50;}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:7px 0;cursor:pointer;border:none;background:none;gap:2px;color:var(--sub);
  font-size:9px;font-weight:500;transition:color .15s;}
.nv.active{color:var(--pr);} .nv .ni2{font-size:20px;}

/* ══ ASSETS PAGE ══ */
.net-card{background:linear-gradient(135deg,var(--pr),var(--pr2));margin:12px 14px;
  border-radius:18px;padding:18px;color:#fff;}
.nc-l{font-size:12px;opacity:.8;margin-bottom:4px;}
.nc-v{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:12px;}
.nc-row{display:flex;gap:16px;}
.nc-item .nil{font-size:11px;opacity:.75;margin-bottom:2px;}
.nc-item .niv{font-size:14px;font-weight:700;}
.a-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--bdr);}
.at{flex:1;padding:11px 0;text-align:center;font-size:13px;font-weight:600;color:var(--sub);
  cursor:pointer;border:none;background:none;border-bottom:2.5px solid transparent;}
.at.active{color:var(--pr);border-bottom-color:var(--pr);}
.a-panel{display:none;padding:12px 14px;} .a-panel.active{display:block;}
.acc-card{background:var(--card);border-radius:18px;padding:13px 14px;display:flex;
  align-items:center;gap:11px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:9px;}
.acc-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;}
.acc-bd{flex:1;}
.acc-nm{font-size:13px;font-weight:700;}
.acc-sb{font-size:11px;color:var(--sub);margin-top:2px;}
.acc-bal{font-size:16px;font-weight:800;color:var(--inc);}
.acc-del{font-size:18px;cursor:pointer;color:var(--sub);}
.cc{background:var(--card);border-radius:18px;padding:13px 14px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:9px;}
.cc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cc-ico{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pr),var(--pr2));
  display:flex;align-items:center;justify-content:center;font-size:18px;}
.cc-nm{font-size:14px;font-weight:700;}
.cc-bk{font-size:11px;color:var(--sub);margin-top:2px;}
.cc-del{margin-left:auto;font-size:18px;cursor:pointer;color:var(--sub);}
.ccbar-bg{height:5px;background:var(--bg);border-radius:3px;margin-bottom:8px;overflow:hidden;}
.ccbar-f{height:100%;border-radius:3px;transition:width .4s;}
.cc-stats{display:flex;}
.cc-stat{flex:1;text-align:center;}
.cs-l{font-size:10px;color:var(--sub);}
.cs-v{font-size:12px;font-weight:700;margin-top:2px;}
.cs-v.ok{color:var(--inc);} .cs-v.warn{color:var(--exp);}
.cc-ft{border-top:1px solid var(--bdr);margin-top:9px;padding-top:8px;
  display:flex;justify-content:space-between;align-items:center;}
.cf-l{font-size:11px;color:var(--sub);}
.cf-v{font-size:13px;font-weight:700;color:var(--exp);}
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;
  background:transparent;border:2px dashed var(--bdr);border-radius:13px;
  padding:12px;cursor:pointer;width:100%;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:9px;}

/* ══ ANALYSIS ══ */
.an-stats{display:flex;gap:8px;padding:12px 14px 0;}
.an-box{flex:1;background:var(--card);border-radius:12px;padding:11px;text-align:center;}
.an-ic{font-size:18px;margin-bottom:3px;}
.an-lb{font-size:10px;color:var(--sub);margin-bottom:2px;}
.an-vl{font-size:13px;font-weight:700;}
.pchips{display:flex;gap:7px;flex-wrap:wrap;padding:10px 14px;}
.pchip{display:flex;align-items:center;gap:5px;background:var(--bg);border-radius:13px;
  padding:5px 10px;font-size:12px;border:1px solid var(--bdr);}
.legend-list{padding:0 14px 12px;display:flex;flex-direction:column;gap:7px;}
.lg-row{display:flex;align-items:center;gap:9px;}
.lg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.lg-nm{flex:1;font-size:13px;font-weight:500;}
.lg-pct{font-size:11px;color:var(--sub);}
.lg-amt{font-size:13px;font-weight:700;color:var(--exp);}
.pie-area{display:flex;justify-content:center;padding:14px;}
.pie-svg{width:150px;height:150px;}

/* ══ SETTINGS ══ */
.set-sec{padding:14px 14px 0;}
.set-ttl{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;}
.set-list{background:var(--card);border-radius:13px;overflow:hidden;}
.set-row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--bdr);cursor:pointer;}
.set-row:last-child{border-bottom:none;}
.set-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.set-bd{flex:1;}
.set-t{font-size:14px;font-weight:600;}
.set-s{font-size:11px;color:var(--sub);margin-top:1px;}
.set-ar{color:var(--sub);}

/* Theme grid */
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
  background:var(--card);border-radius:13px;padding:14px;}
.th-item{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
.th-dot{width:42px;height:42px;border-radius:50%;border:3px solid transparent;transition:all .2s;}
.th-dot.active{border-color:var(--tx);transform:scale(1.08);}
.th-lbl{font-size:10px;color:var(--sub);font-weight:500;}

/* Fixed TX list */
.ftx{display:flex;flex-direction:column;gap:8px;}
.ftx-row{background:var(--card);border-radius:12px;padding:11px 13px;
  display:flex;align-items:center;gap:9px;}
.ftx-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.ftx-bd{flex:1;}
.ftx-nm{font-size:13px;font-weight:600;}
.ftx-sb{font-size:11px;color:var(--sub);}
.ftx-amt{font-size:13px;font-weight:700;margin-right:8px;}
.ftx-del{color:var(--sub);cursor:pointer;font-size:17px;}

/* Switch */
.sw{position:relative;width:40px;height:23px;cursor:pointer;flex-shrink:0;display:inline-block;}
.sw input{opacity:0;width:0;height:0;}
.sw-t{position:absolute;inset:0;border-radius:12px;background:var(--bdr);transition:background .2s;}
.sw input:checked+.sw-t{background:var(--pr);}
.sw-k{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;
  background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.sw input:checked~.sw-k{left:20px;}

/* Budget card */
.bgt{background:var(--card);border-radius:13px;padding:13px;}
.bgt-hd{display:flex;justify-content:space-between;margin-bottom:7px;}
.bgt-l{font-size:14px;font-weight:600;}
.bgt-v{font-size:14px;color:var(--pr);font-weight:700;}
.bbar2{height:5px;background:var(--bdr);border-radius:3px;overflow:hidden;margin-bottom:5px;}
.bbar2-f{height:100%;border-radius:3px;transition:width .5s;}
.bgt-sb{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);}

/* ══ ADD MODAL (centered) ══ */
#add-ov,#fixed-ov{align-items:center;justify-content:center;}
#add-ov .sheet,#fixed-ov .sheet{border-radius:20px;width:92%;max-width:400px;
  max-height:88vh;padding-bottom:16px;
  animation:sPop .28s cubic-bezier(.34,1.56,.64,1);}
@keyframes sPop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
/* Main category grid */
.mcat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 14px 12px;}
.mc2{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  padding:8px 4px;border-radius:12px;border:2px solid transparent;background:var(--bg);}
.mc2.sel{border-color:var(--pr);background:rgba(var(--pr-rgb),.08);}
.mc2:active{transform:scale(.92);}
.mc2-i{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;}
.mc2-l{font-size:10px;color:var(--sub);font-weight:500;text-align:center;line-height:1.2;}

/* ══ LULU STYLE ══ */
.lulu-banner{background:linear-gradient(135deg,#FFE4EF,#FFF0F5);
  padding:14px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--bdr);}
.lulu-avatar{width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,#FFB3CC,#FF7BAC);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:0 4px 12px rgba(255,123,172,.35);flex-shrink:0;
  animation:pigBob 2.4s ease-in-out infinite;
  cursor:pointer;position:relative;overflow:hidden;}
.lulu-avatar-cam{position:absolute;bottom:0;left:0;right:0;
  background:rgba(0,0,0,.35);text-align:center;font-size:10px;
  padding:2px 0;line-height:1.2;}
@keyframes pigBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.lulu-greet{flex:1;}
.lulu-greet-t{font-size:15px;font-weight:800;color:var(--tx);}
.lulu-greet-s{font-size:22px;color:var(--sub);margin-top:2px;}
.lulu-deco{display:flex;flex-direction:column;gap:3px;font-size:14px;
  animation:twinkle 1.8s ease-in-out infinite alternate;}
@keyframes twinkle{from{opacity:.5;transform:scale(.9)}to{opacity:1;transform:scale(1.1)}}
/* Bubble category bg */
.mc2{border-radius:16px;}
.mc2-i{border-radius:14px;}
/* Cute card extras */
.sec{border-radius:0;}
.acc-card,.cc,.etf-card{box-shadow:0 3px 14px rgba(255,123,172,.12);}
/* Cute FAB */
.fab{box-shadow:0 4px 18px rgba(var(--pr-rgb),.5);}
/* Pink scrollbar */
::-webkit-scrollbar{width:3px;} ::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px;}

/* ══ LOCK SCREEN ══ */
.lock-scr{position:fixed;inset:0;z-index:9999;
  background:linear-gradient(160deg,#FFE4EF 0%,#FFF4F8 50%,#FFE4F0 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;}
.lock-scr.hidden{display:none;}
.lock-logo{font-size:56px;margin-bottom:10px;}
.lock-ttl{font-size:22px;font-weight:800;margin-bottom:4px;}
.lock-sub{font-size:13px;color:var(--sub);margin-bottom:32px;}
.pin-dots{display:flex;gap:18px;margin-bottom:32px;}
.pin-dot{width:15px;height:15px;border-radius:50%;border:2.5px solid var(--pr);transition:background .15s;}
.pin-dot.filled{background:var(--pr);}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:252px;}
.np-btn{height:68px;border-radius:50%;border:none;background:var(--card);
  font-size:24px;font-weight:500;cursor:pointer;color:var(--tx);
  box-shadow:0 2px 8px rgba(0,0,0,.08);transition:all .12s;}
.np-btn:active{transform:scale(.9);background:var(--bdr);}
.np-btn.del{font-size:20px;background:transparent;box-shadow:none;}
.np-btn.empty{background:transparent;box-shadow:none;pointer-events:none;}
.lock-err{color:var(--exp);font-size:13px;margin-top:14px;min-height:18px;font-weight:500;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

/* ══ TRANSFER & ETF ══ */
.tbtn2.atr{background:#5AC8FA;color:#fff;}
.tx-amt.transfer{color:#5AC8FA;}
.etf-card{background:var(--card);border-radius:18px;padding:13px 14px;display:flex;
  align-items:center;gap:11px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:9px;}
.etf-ico{width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,#00B894,#0984E3);
  display:flex;align-items:center;justify-content:center;font-size:19px;}
.etf-bd{flex:1;}
.etf-nm{font-size:13px;font-weight:700;}
.etf-sb{font-size:11px;color:var(--sub);margin-top:2px;}
.etf-bal{font-size:15px;font-weight:800;color:var(--inc);}
</style>
</head>
<body>

<!-- ════════ HOME ════════ -->
<div id="page-home" class="page active">
  <div class="topbar">
    <div class="tb-m" style="gap:4px">
      <button class="tbtn" onclick="chMon(-1)">‹</button>
      <span id="hl-mon"></span>
      <button class="tbtn" onclick="chMon(1)">›</button>
    </div>
    <button class="tbtn" style="font-size:17px" onclick="switchPage('settings')">🌸</button>
  </div>
  <div class="scr">
    <div class="lulu-banner">
      <div class="lulu-avatar" onclick="document.getElementById('avatar-input').click()" title="點擊更換頭像">
        <img id="lulu-avatar-img" src="" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:50%;position:absolute;inset:0;">
        <span id="lulu-avatar-emoji">🐷</span>
        <div class="lulu-avatar-cam">📷</div>
      </div>
      <input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
      <div class="lulu-greet">
        <div class="lulu-greet-s" id="lulu-date"></div>
      </div>
      <div class="lulu-deco"><span>✨</span><span>💕</span><span>⭐</span></div>
    </div>
    <div class="donut-sec">
      <div class="d-wrap">
        <div class="d-ring">
          <svg viewBox="0 0 120 120" id="d-svg">
            <circle cx="60" cy="60" r="48" fill="none" stroke="var(--bg)" stroke-width="13"/>
            <circle cx="60" cy="60" r="48" fill="none" stroke="var(--inc)" stroke-width="13"
              stroke-linecap="round" stroke-dasharray="0 302" stroke-dashoffset="75.5" id="d-inc"/>
            <circle cx="60" cy="60" r="48" fill="none" stroke="var(--exp)" stroke-width="13"
              stroke-linecap="round" stroke-dasharray="0 302" stroke-dashoffset="75.5" id="d-exp"
              style="transition:all .6s ease;"/>
          </svg>
          <div class="d-ctr"><div class="dl">月結餘</div><div class="dv pos" id="d-bal">$0</div></div>
        </div>
        <div class="d-stats">
          <div class="dst"><div class="dsdot" style="background:var(--inc)"></div>
            <div><div class="dsl">本月收入</div><div class="dsv inc" id="hs-inc">$0</div></div></div>
          <div class="dst"><div class="dsdot" style="background:var(--exp)"></div>
            <div><div class="dsl">本月支出</div><div class="dsv exp" id="hs-exp">$0</div></div></div>
        </div>
      </div>
      <div class="bstrip">
        <div class="bstrip-hd"><span>預算進度</span><span id="bstrip-v"></span></div>
        <div class="bbar"><div class="bbarf" id="bbarf"></div></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-hd"><div class="t">最近記錄</div><button class="m" onclick="switchPage('records')">查看全部 ›</button></div>
      <div id="home-list"></div>
    </div>
  </div>
</div>

<!-- ════════ RECORDS ════════ -->
<div id="page-records" class="page">
  <div class="topbar">
    <div class="tb-m"><button class="tbtn" onclick="chMon(-1)">‹</button>
      <span id="rl-mon"></span>
      <button class="tbtn" onclick="chMon(1)">›</button></div>
    <span style="font-size:12px;color:var(--sub)" id="rl-sum"></span>
  </div>
  <div class="scr" id="rec-list"></div>
  <button class="fab" id="fab-add" onclick="openAddSheet()">🐷</button>
</div>

<!-- ════════ ASSETS ════════ -->
<div id="page-assets" class="page">
  <div class="topbar"><div style="font-size:17px;font-weight:700">資產管理</div></div>
  <div class="scr">
    <div class="net-card">
      <div class="nc-l">淨資產</div>
      <div class="nc-v" id="net-worth">NT$0</div>
      <div class="nc-row">
        <div class="nc-item"><div class="nil">帳戶</div><div class="niv" id="total-assets">NT$0</div></div>
        <div class="nc-item"><div class="nil">ETF投資</div><div class="niv" id="total-etf">NT$0</div></div>
        <div class="nc-item"><div class="nil">信用負債</div><div class="niv" id="total-debt">NT$0</div></div>
      </div>
    </div>
    <div class="a-tabs">
      <button class="at active" id="at-acc" onclick="switchAssetTab('acc')">💰 帳戶</button>
      <button class="at" id="at-cc" onclick="switchAssetTab('cc')">💳 信用卡</button>
      <button class="at" id="at-etf" onclick="switchAssetTab('etf')">📈 ETF</button>
    </div>
    <div class="a-panel active" id="ap-acc">
      <div id="acc-list"></div>
      <button class="add-btn" onclick="openAssetSheet('acc')">＋ 新增帳戶</button>
    </div>
    <div class="a-panel" id="ap-cc">
      <div id="cc-list"></div>
      <button class="add-btn" onclick="openAssetSheet('cc')">＋ 新增信用卡</button>
    </div>
    <div class="a-panel" id="ap-etf">
      <div id="etf-list"></div>
    </div>
  </div>
</div>

<!-- ════════ ANALYSIS ════════ -->
<div id="page-analysis" class="page">
  <div class="topbar">
    <div class="tb-m"><button class="tbtn" onclick="chMon(-1)">‹</button>
      <span id="al-mon"></span>
      <button class="tbtn" onclick="chMon(1)">›</button></div>
    <span style="font-size:12px;color:var(--sub)">支出分析</span>
  </div>
  <div class="scr" style="padding-top:0">
    <div class="an-stats">
      <div class="an-box"><div class="an-ic">📅</div><div class="an-lb">日均支出</div><div class="an-vl" id="an-daily"></div></div>
      <div class="an-box"><div class="an-ic">📝</div><div class="an-lb">記帳筆數</div><div class="an-vl" id="an-cnt"></div></div>
      <div class="an-box"><div class="an-ic">🔝</div><div class="an-lb">最大支出</div><div class="an-vl" id="an-max"></div></div>
    </div>
    <div class="sec" style="margin-top:10px">
      <div class="sec-hd"><div class="t">支付方式</div></div>
      <div class="pchips" id="an-pays"></div>
    </div>
    <div class="sec">
      <div class="sec-hd"><div class="t">類別佔比</div></div>
      <div class="pie-area"><svg class="pie-svg" id="pie" viewBox="0 0 180 180"></svg></div>
      <div class="legend-list" id="legend"></div>
    </div>
  </div>
</div>

<!-- ════════ SETTINGS ════════ -->
<div id="page-settings" class="page">
  <div class="topbar"><div style="font-size:17px;font-weight:700">設定</div></div>
  <div class="scr" style="padding-top:0">
    <div class="set-sec">
      <div class="set-ttl">色彩主題</div>
      <div class="theme-grid" id="theme-grid"></div>
    </div>
    <div class="set-sec" style="margin-top:14px">
      <div class="set-ttl">預算管理</div>
      <div class="bgt">
        <div class="bgt-hd"><div class="bgt-l">月度預算</div><div class="bgt-v" id="bgt-v"></div></div>
        <div class="bbar2"><div class="bbar2-f" id="bbar2-f"></div></div>
        <div class="bgt-sb"><span>已用 <span id="bgt-u"></span></span><span>剩餘 <span id="bgt-l2"></span></span></div>
        <input type="range" min="1000" max="200000" step="1000" style="width:100%;margin-top:10px;accent-color:var(--pr)"
          id="bgt-sl" oninput="updBudget(this.value)">
      </div>
    </div>
    <div class="set-sec" style="margin-top:14px">
      <div class="set-ttl" style="display:flex;justify-content:space-between;align-items:center">
        固定收支
        <button style="background:var(--pr);color:#fff;border:none;border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer" onclick="openFixedSheet()">＋ 新增</button>
      </div>
      <div class="ftx" id="fixed-list"><div style="color:var(--sub);font-size:13px;padding:8px 0">尚無固定收支</div></div>
    </div>
    <div class="set-sec" style="margin-top:14px">
      <div class="set-ttl">資料</div>
      <div class="set-list">
        <div class="set-row" onclick="exportData()">
          <div class="set-ic" style="background:#E8F5E9">📤</div>
          <div class="set-bd"><div class="set-t">匯出記錄</div><div class="set-s">匯出本月 CSV</div></div>
          <div class="set-ar">›</div>
        </div>
        <div class="set-row" onclick="clearData()">
          <div class="set-ic" style="background:#FFEBEE">🗑️</div>
          <div class="set-bd"><div class="set-t">清除本月資料</div><div class="set-s">清除後無法恢復</div></div>
          <div class="set-ar">›</div>
        </div>
      </div>
    </div>
    <div class="set-sec" style="margin-top:14px">
      <div class="set-ttl">安全</div>
      <div class="set-list">
        <div class="set-row" onclick="openPinSheet()">
          <div class="set-ic" style="background:#EDE7F6">🔐</div>
          <div class="set-bd"><div class="set-t">APP 密碼鎖</div><div class="set-s" id="pin-status">未啟用</div></div>
          <div class="set-ar">›</div>
        </div>
      </div>
    </div>
    <div style="text-align:center;padding:24px;color:var(--sub);font-size:12px">🐷 記帳本 v5.0 🌸</div>
  </div>
</div>

<!-- ════════ BOTTOM NAV ════════ -->
<div class="bnav">
  <button class="nv active" id="nav-home"     onclick="switchPage('home')"    ><span class="ni2">🏡</span>首頁</button>
  <button class="nv"        id="nav-records"  onclick="switchPage('records')" ><span class="ni2">📝</span>記錄</button>
  <button class="nv"        id="nav-assets"   onclick="switchPage('assets')"  ><span class="ni2">💰</span>資產</button>
  <button class="nv"        id="nav-analysis" onclick="switchPage('analysis')"><span class="ni2">🎀</span>分析</button>
  <button class="nv"        id="nav-settings" onclick="switchPage('settings')"><span class="ni2">🌸</span>設定</button>
</div>

<!-- ════════ LOCK SCREEN ════════ -->
<div id="lock-scr" class="lock-scr hidden">
  <div class="lock-logo" style="animation:pigBob 2s ease-in-out infinite">🐷</div>
  <div class="lock-ttl" style="color:#FF7BAC">LuLu 記帳本</div>
  <div style="font-size:16px;letter-spacing:4px;margin:-8px 0 4px">✨ 💕 ✨</div>
  <div class="lock-sub">請輸入 4 位數密碼</div>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="pd0"></div>
    <div class="pin-dot" id="pd1"></div>
    <div class="pin-dot" id="pd2"></div>
    <div class="pin-dot" id="pd3"></div>
  </div>
  <div class="numpad">
    <button class="np-btn" onclick="pinInput('1')">1</button>
    <button class="np-btn" onclick="pinInput('2')">2</button>
    <button class="np-btn" onclick="pinInput('3')">3</button>
    <button class="np-btn" onclick="pinInput('4')">4</button>
    <button class="np-btn" onclick="pinInput('5')">5</button>
    <button class="np-btn" onclick="pinInput('6')">6</button>
    <button class="np-btn" onclick="pinInput('7')">7</button>
    <button class="np-btn" onclick="pinInput('8')">8</button>
    <button class="np-btn" onclick="pinInput('9')">9</button>
    <button class="np-btn empty"></button>
    <button class="np-btn" onclick="pinInput('0')">0</button>
    <button class="np-btn del" onclick="pinDel()">⌫</button>
  </div>
  <div class="lock-err" id="lock-err"></div>
</div>

<!-- ════════ PIN SETUP SHEET ════════ -->
<div class="ov" id="pin-ov" onclick="closeOvOutside(event,'pin-ov')">
  <div class="sheet">
    <div class="s-hnd"></div>
    <div class="s-ttl" id="pin-s-ttl">APP 密碼鎖</div>
    <div id="pin-form"></div>
  </div>
</div>

<!-- ════════ ADD TRANSACTION SHEET ════════ -->
<div class="ov" id="add-ov" onclick="closeOvOutside(event,'add-ov')">
  <div class="sheet">
    <div class="s-hnd"></div>
    <div class="s-ttl">新增記帳</div>
    <div class="type-row">
      <button class="tbtn2 ae" id="at-exp" onclick="setAddType('expense')">💸 支出</button>
      <button class="tbtn2"    id="at-inc" onclick="setAddType('income')">💰 收入</button>
      <button class="tbtn2"    id="at-tr"  onclick="setAddType('transfer')">🔄 轉帳</button>
    </div>
    <div class="amt-row">
      <div class="amt-sy">NT$</div>
      <input class="amt-in" type="number" id="add-amt" placeholder="0" inputmode="decimal">
      <button class="amt-cl" onclick="document.getElementById('add-amt').value=''">✕</button>
    </div>
    <div id="add-steps"></div>
  </div>
</div>

<!-- ════════ ASSET SHEET ════════ -->
<div class="ov" id="asset-ov" onclick="closeOvOutside(event,'asset-ov')">
  <div class="sheet">
    <div class="s-hnd"></div>
    <div class="s-ttl" id="asset-s-ttl">新增帳戶</div>
    <div id="asset-form"></div>
  </div>
</div>

<!-- ════════ FIXED TX SHEET ════════ -->
<div class="ov" id="fixed-ov" onclick="closeOvOutside(event,'fixed-ov')">
  <div class="sheet">
    <div class="s-hnd"></div>
    <div class="s-ttl">新增固定收支</div>
    <div id="fixed-form"></div>
  </div>
</div>

/* ═══ UTILS ═══ */
const fmt  = n => 'NT$'+Math.abs(n).toLocaleString();
const fmts = n => '$'+Math.abs(n).toLocaleString();
const mLbl = () => `${cYr}年${cMon+1}月`;
const isMth= t => { const d=new Date(t.date); return d.getMonth()===cMon&&d.getFullYear()===cYr; };
const mTxs = () => TXS.filter(isMth);
const mInc = () => mTxs().filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
const mExp = () => mTxs().filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
const catOf= (tp,k) => (CATS[tp]||CATS.expense).find(c=>c.key===k)||{icon:'📦',bg:'#ECEFF1'};

const saveA= () => { localStorage.setItem('accs',JSON.stringify(ACCS)); localStorage.setItem('ccs',JSON.stringify(CCS)); };

/* ═══ THEME ═══ */
function applyTheme(t){
  theme=t; localStorage.setItem('theme',t);
  document.documentElement.setAttribute('data-theme',t);
  renderThemeGrid();
}
function renderThemeGrid(){
  const el=document.getElementById('theme-grid'); if(!el) return;
  el.innerHTML=THEMES.map(t=>`
    <div class="th-item" onclick="applyTheme('${t.id}')">
      <div class="th-dot ${theme===t.id?'active':''}" style="background:${t.color}"></div>
      <div class="th-lbl">${t.name}</div>
    </div>`).join('');
}

/* ═══ FIXED TX ═══ */
function applyFixedTx(){
  const today=new Date();
  const mk=`${today.getFullYear()}-${today.getMonth()}`;
  let changed=false;
  FIXED.filter(f=>f.active).forEach(f=>{
    const key=`${mk}-${f.id}`;
    if(APPLIED[key]) return;
    if(today.getDate()>=f.dayOfMonth){
      const d=new Date(today.getFullYear(),today.getMonth(),f.dayOfMonth);
      TXS.push({id:`fx_${f.id}_${mk}`,type:f.type,amount:f.amount,
        mainCat:f.mainCat,subCat:f.subCat,payment:f.payment,
        note:(f.note||'')+'【固定】',date:d.toISOString()});
      APPLIED[key]=true; changed=true;
    }
  });
  if(changed){ save(); localStorage.setItem('applied',JSON.stringify(APPLIED)); }
}

function renderAll(){
  const inc=mInc(), exp=mExp(), bal=inc-exp;
  // month labels
  ['hl-mon','rl-mon','al-mon'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=mLbl();});

  renderDonut(inc,exp,bal);

  const si=document.getElementById('hs-inc'); if(si) si.textContent=fmts(inc);

  renderHomeList(); renderRecList();

}

function renderDonut(inc,exp,bal){
  const circ=2*Math.PI*48; // r=48
  const total=inc+exp||1;
  const incArc=circ*(inc/total), expArc=circ*(exp/total);
  const di=document.getElementById('d-inc'), de=document.getElementById('d-exp');
  const db=document.getElementById('d-bal');
  if(di){
    di.style.strokeDasharray=`${incArc} ${circ-incArc}`;
    di.style.strokeDashoffset=(-circ/4);
    di.style.transition='all .6s ease';
  }
  if(de){
    de.style.strokeDasharray=`${expArc} ${circ-expArc}`;
    de.style.strokeDashoffset=(-circ/4)-incArc;
    de.style.transition='all .6s ease';
  }
  if(db){ db.textContent=fmts(Math.abs(bal)); db.className='dv '+(bal>=0?'pos':'neg'); }
}

function renderBudgetStrip(exp){
  const pct=Math.min(100,Math.round(exp/budget*100));
  const f=document.getElementById('bbarf'); if(f){
    f.style.width=pct+'%';
    f.style.background=pct>=90?'var(--exp)':pct>=70?'#FF9500':'var(--inc)';
  }
  const v=document.getElementById('bstrip-v'); if(v) v.textContent=`${fmt(exp)} / ${fmt(budget)}`;
}

function buildTxRow(tx){
  const d=new Date(tx.date);
  const ts=`${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  if(tx.type==='transfer'){
    const fromA=ACCS.find(a=>a.id===tx.fromAcc)||{name:tx.fromAcc||'帳戶',icon:'🏦'};
    const toA=ACCS.find(a=>a.id===tx.toAcc)||{name:tx.toAcc||'帳戶',icon:'🏦'};
    return `<div class="tx-row" id="tx-${tx.id}">
      <div class="tx-ico" style="background:#E3F2FD">🔄</div>
      <div class="tx-bd">
        <div class="tx-nm">${fromA.name} → ${toA.name}${tx.note?' · '+tx.note:''}</div>
        <div class="tx-mt">${ts} <span class="tx-tag">轉帳</span></div>
      </div>
      <div class="tx-rt">
        <div class="tx-amt transfer">${fmt(tx.amount)}</div>
        <div class="tx-del" onclick="delTx('${tx.id}')">刪除</div>
      </div>
    </div>`;
  }
  const info=catOf(tx.type,tx.mainCat);
  const path=tx.subCat?`${tx.mainCat} › ${tx.subCat}`:tx.mainCat;
  const payIcon=(PAYS.find(p=>p.key===tx.payment)||{icon:'📱'}).icon;
  const sign=tx.type==='income'?'+':'-';
  return `<div class="tx-row" id="tx-${tx.id}">
    <div class="tx-ico" style="background:${info.bg}">${info.icon}</div>
    <div class="tx-bd">
      <div class="tx-nm">${path}${tx.note?' · '+tx.note:''}</div>
      <div class="tx-mt">${ts} <span class="tx-tag">${payIcon} ${tx.payment||'現金'}</span></div>
    </div>
    <div class="tx-rt">
      <div class="tx-amt ${tx.type}">${sign}${fmt(tx.amount)}</div>
      <div class="tx-del" onclick="delTx('${tx.id}')">刪除</div>
    </div>
  </div>`;
}

function renderHomeList(){
  const el=document.getElementById('home-list'); if(!el) return;
  const list=mTxs().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
  el.innerHTML=list.length?list.map(buildTxRow).join('')

}

function renderRecList(){
  const el=document.getElementById('rec-list'); if(!el) return;
  const list=mTxs().sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!list.length){el.innerHTML=`<div class="empty"><div class="ei">📋</div><p>本月暫無記錄</p></div>`;return;}
  const grp={};
  list.forEach(t=>{
    const d=new Date(t.date);

    if(!grp[k])grp[k]={lbl:`${d.getMonth()+1}月${d.getDate()}日`,items:[],exp:0};
    grp[k].items.push(t);

    <div class="sec" style="margin-bottom:10px">

function renderAnalysis(){
  const txs=mTxs().filter(t=>t.type==='expense');
  const total=txs.reduce((s,t)=>s+t.amount,0);
  const ad=document.getElementById('an-daily'); if(ad) ad.textContent=fmt(Math.round(total/Math.max(1,new Date().getDate())));
  const ac=document.getElementById('an-cnt');   if(ac) ac.textContent=txs.length+' 筆';
  const am=document.getElementById('an-max');   if(am) am.textContent=fmt(txs.reduce((m,t)=>t.amount>m?t.amount:m,0));
  // payment
  const payMap={};
  txs.forEach(t=>{const k=t.payment||'現金';payMap[k]=(payMap[k]||0)+t.amount;});
  const pc=document.getElementById('an-pays'); if(pc)
    pc.innerHTML=Object.keys(payMap).length
      ?Object.entries(payMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
          const p=PAYS.find(x=>x.key===k)||{icon:'📱'};
          return `<div class="pchip">${p.icon} ${k} <span style="color:var(--exp);font-weight:700;margin-left:4px">${fmt(v)}</span></div>`;
        }).join('')
      :'<span style="color:var(--sub);font-size:13px">暫無資料</span>';
  // pie
  const catMap={};
  txs.forEach(t=>{catMap[t.mainCat]=(catMap[t.mainCat]||0)+t.amount;});
  const sorted=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const svg=document.getElementById('pie'), lgd=document.getElementById('legend');
  if(!svg||!lgd) return;
  if(!sorted.length){
    svg.innerHTML=`<circle cx="90" cy="90" r="70" fill="var(--bg)"/>`;
    lgd.innerHTML=`<div style="text-align:center;color:var(--sub);padding:10px">暫無支出資料</div>`;
    return;
  }
  let ang=-Math.PI/2, h='';
  sorted.forEach(([cat,amt],i)=>{
    const a=amt/total*2*Math.PI;
    const x1=90+70*Math.cos(ang),y1=90+70*Math.sin(ang);
    const x2=90+70*Math.cos(ang+a),y2=90+70*Math.sin(ang+a);
    h+=`<path d="M90,90 L${x1},${y1} A70,70 0 ${a>Math.PI?1:0},1 ${x2},${y2} Z" fill="${PIE_CLR[i%PIE_CLR.length]}"/>`;
    ang+=a;
  });
  svg.innerHTML=h+`<circle cx="90" cy="90" r="36" fill="var(--card)"/>`;
  lgd.innerHTML=sorted.map(([cat,amt],i)=>{
    const info=catOf('expense',cat);
    return `<div class="lg-row">
      <div class="lg-dot" style="background:${PIE_CLR[i%PIE_CLR.length]}"></div>
      <span style="font-size:16px">${info.icon}</span>
      <div class="lg-nm">${cat}</div>
      <div class="lg-pct">${(amt/total*100).toFixed(0)}%</div>
      <div class="lg-amt">${fmt(amt)}</div>
    </div>`;
  }).join('');
}

function renderAddStep(){
  const el=document.getElementById('add-steps'); if(!el) return;
  if(aType==='transfer'){ el.innerHTML=buildTransferStep(); return; }
  if(aStep===0) el.innerHTML=buildAS0();
  else if(aStep===1) el.innerHTML=buildAS1();
  else el.innerHTML=buildAS2();
}

function buildTransferStep(){
  if(!ACCS.length) return `<div class="empty"><div class="ei">🏦</div><p>請先到「資產」頁新增帳戶</p></div>`;
  const accBtns=id=>ACCS.map(a=>`
    <div class="pg ${id==='from'&&aTransFrom===a.id||id==='to'&&aTransTo===a.id?'sel':''}"
      onclick="${id==='from'?'aTransFrom':'aTransTo'}='${a.id}';renderAddStep()">
      <div class="pg-i">${a.icon||'🏦'}</div>
      <div class="pg-l" style="font-size:10px">${a.name}</div>
    </div>`).join('');
  return `<div class="slbl"><div class="snum">1</div> 轉出帳戶</div>
    <div class="pgrid">${accBtns('from')}</div>
    <div class="slbl"><div class="snum">2</div> 轉入帳戶</div>
    <div class="pgrid">${accBtns('to')}</div>
    <div class="ni-row"><input class="ni" type="text" id="add-note" placeholder="備註（選填）"></div>
    <button class="sbtn" style="background:#5AC8FA" onclick="doAdd()">轉帳完成 ✓</button>`;
}

function buildAS0(){
  return `<div class="slbl"><div class="snum">1</div> 選擇分類</div>
    <div class="mcat-grid">${CATS[aType].map(c=>`
      <div class="mc2" onclick="pickAMain('${c.key}')">
        <div class="mc2-i" style="background:${c.bg}">${c.icon}</div>

function buildAS1(){
  if(!aMain) return buildAS0();
  return `<div class="slbl"><button class="sbk" onclick="aStep=0;renderAddStep()">‹ 返回</button><div class="snum">2</div> ${aMain.icon} ${aMain.key}</div>
    <div class="sgrid">${aMain.sub.map(s=>`
      <div class="sg ${aSub===s.key?'sel':''}" onclick="pickASub('${s.key}')">
        <div class="sg-i">${s.icon}</div><div class="sg-l">${s.key}</div>
      </div>`).join('')}</div>`;
}
function buildAS2(){
  const btnBg=aType==='expense'?'background:var(--exp)':'background:var(--inc)';
  return `<div class="slbl"><button class="sbk" onclick="aStep=1;renderAddStep()">‹ 返回</button><div class="snum">3</div> 支付方式</div>
    <div class="crumbs"><div class="crumb">${aMain?.icon} ${aMain?.key}</div>${aSub?`<div class="crumb">› ${aSub}</div>`:''}</div>
    <div class="pgrid">${PAYS.map(p=>`
      <div class="pg ${aPay===p.key?'sel':''}" onclick="pickAPay('${p.key}')">
        <div class="pg-i">${p.icon}</div><div class="pg-l">${p.key}</div>
      </div>`).join('')}</div>
    <div class="ni-row"><input class="ni" type="text" id="add-note" placeholder="備註（選填）"></div>
    <button class="sbtn" style="${btnBg}" onclick="doAdd()">記帳完成 ✓</button>`;

function pickAMain(k){ aMain=CATS[aType].find(c=>c.key===k); aSub=''; aStep=1; renderAddStep(); }
function pickASub(k){ aSub=k; aStep=2; renderAddStep(); }
function pickAPay(k){ aPay=k; renderAddStep(); }

function doAdd(){
  const amt=parseFloat(document.getElementById('add-amt').value);
  if(!amt||amt<=0){ document.getElementById('add-amt').style.color='var(--exp)'; setTimeout(()=>document.getElementById('add-amt').style.color='',600); return; }
  const note=(document.getElementById('add-note')||{value:''}).value.trim();
  if(aType==='transfer'){
    if(!aTransFrom){alert('請選擇轉出帳戶');return;}
    if(!aTransTo){alert('請選擇轉入帳戶');return;}
    if(aTransFrom===aTransTo){alert('轉出和轉入帳戶不能相同');return;}
    const fromA=ACCS.find(a=>a.id===aTransFrom);
    const toA=ACCS.find(a=>a.id===aTransTo);
    if(fromA) fromA.balance-=amt;
    if(toA) toA.balance+=amt;
    saveA();
    TXS.unshift({id:sid(),type:'transfer',amount:amt,fromAcc:aTransFrom,toAcc:aTransTo,note,date:new Date().toISOString()});
    save(); closeOv('add-ov'); renderAll();
    if(navigator.vibrate) navigator.vibrate(30);
    return;
  }
  if(!aMain){ alert('請選擇分類'); aStep=0; renderAddStep(); return; }
  if(!aSub){ alert('請選擇細項'); aStep=1; renderAddStep(); return; }
  if(!aPay){ alert('請選擇支付方式'); return; }
  TXS.unshift({id:sid(),type:aType,amount:amt,mainCat:aMain.key,subCat:aSub,payment:aPay,note,date:new Date().toISOString()});
  save(); closeOv('add-ov'); renderAll();
  if(navigator.vibrate) navigator.vibrate(30);
}

/* ═══ PIN LOCK ═══ */
let pinBuf='';
function checkLock(){
  if(!localStorage.getItem('pin')) return;
  document.getElementById('lock-scr').classList.remove('hidden');
}
function pinInput(n){
  if(pinBuf.length>=4) return;
  pinBuf+=n; updPinDots();
  if(pinBuf.length===4) verifyPin();
}
function pinDel(){
  pinBuf=pinBuf.slice(0,-1); updPinDots();
  document.getElementById('lock-err').textContent='';
}
function updPinDots(){
  for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d)d.classList.toggle('filled',i<pinBuf.length);}
}
function verifyPin(){
  if(pinBuf===localStorage.getItem('pin')){
    document.getElementById('lock-scr').classList.add('hidden');
    pinBuf=''; updPinDots();
  } else {
    document.getElementById('lock-err').textContent='密碼錯誤，請重試';
    const dots=document.getElementById('pin-dots');
    dots.style.animation='shake .4s';
    setTimeout(()=>{dots.style.animation='';pinBuf='';updPinDots();},450);
  }
}
function renderPinStatus(){
  const el=document.getElementById('pin-status');
  if(el) el.textContent=localStorage.getItem('pin')?'已啟用 🔒':'未啟用';
}
function openPinSheet(){
  const hasPIN=!!localStorage.getItem('pin');
  const ttl=document.getElementById('pin-s-ttl'); if(ttl) ttl.textContent='APP 密碼鎖';
  const frm=document.getElementById('pin-form'); if(!frm) return;
  if(!hasPIN){
    frm.innerHTML=`
      <div style="padding:14px 16px 6px;font-size:13px;color:var(--sub)">設定 4 位數字密碼</div>
      <div class="ni-row"><input class="ni" type="password" inputmode="numeric" maxlength="4" id="new-pin" placeholder="輸入新密碼（4位數字）"></div>
      <div class="ni-row"><input class="ni" type="password" inputmode="numeric" maxlength="4" id="cfm-pin" placeholder="再輸入一次確認"></div>
      <button class="sbtn" style="background:var(--pr);margin-top:6px" onclick="savePin()">啟用密碼鎖</button>`;
  } else {
    frm.innerHTML=`
      <div style="padding:14px 16px 6px;font-size:13px;color:var(--sub)">密碼鎖已啟用</div>
      <div class="ni-row"><input class="ni" type="password" inputmode="numeric" maxlength="4" id="new-pin" placeholder="輸入新密碼（如需變更）"></div>
      <div class="ni-row"><input class="ni" type="password" inputmode="numeric" maxlength="4" id="cfm-pin" placeholder="再輸入一次確認"></div>
      <button class="sbtn" style="background:var(--pr);margin-top:6px" onclick="savePin()">變更密碼</button>
      <button class="sbtn" style="background:var(--exp);margin-top:4px" onclick="removePin()">關閉密碼鎖</button>`;
  }
  document.getElementById('pin-ov').classList.add('open');
}
function savePin(){
  const np=(document.getElementById('new-pin')||{value:''}).value.trim();
  const cp=(document.getElementById('cfm-pin')||{value:''}).value.trim();
  if(!/^\d{4}$/.test(np)){alert('請輸入 4 位數字');return;}
  if(np!==cp){alert('兩次密碼不一致');return;}
  localStorage.setItem('pin',np);
  closeOv('pin-ov'); renderPinStatus();
  alert('密碼設定成功！');
}
function removePin(){
  if(!confirm('確定關閉密碼鎖？')) return;
  localStorage.removeItem('pin');
  closeOv('pin-ov'); renderPinStatus();
}

/* ═══ CRUD ═══ */
function delTx(id){
  if(!confirm('確定刪除？')) return;
  const tx=TXS.find(t=>t.id===id);
  if(tx && tx.type==='transfer'){
    const fromA=ACCS.find(a=>a.id===tx.fromAcc);
    const toA=ACCS.find(a=>a.id===tx.toAcc);
    if(fromA) fromA.balance+=tx.amount;
    if(toA) toA.balance-=tx.amount;
    saveA();
  }
  TXS=TXS.filter(t=>t.id!==id); save(); renderAll();
}

function exportData(){
  const data=mTxs(); if(!data.length){alert('本月沒有資料');return;}
  let csv='日期,類型,主分類,細項,支付方式,金額,備註\n';
  data.forEach(t=>{const d=new Date(t.date);csv+=`${d.toLocaleDateString()},${t.type==='income'?'收入':'支出'},${t.mainCat},${t.subCat||''},${t.payment||'現金'},${t.amount},${t.note||''}\n`;});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download=`記帳_${mLbl()}.csv`; a.click();
}

function uploadAvatar(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();

    showAvatar(e.target.result);

  reader.readAsDataURL(file);
}
